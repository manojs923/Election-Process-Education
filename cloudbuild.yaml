steps:
  # Install dependencies & run tests
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
  
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'test']

  # Build Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voter-education-ai', '.']

  # Push Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/voter-education-ai']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'voter-education-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/voter-education-ai'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/voter-education-ai'
